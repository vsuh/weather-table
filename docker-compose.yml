# Weather Table: Prometheus + Grafana (мониторинг) и, по желанию, коллектор + API.
#
# РЕЖИМ 1 (рекомендуется на HELOR): коллектор и API работают под systemd, в Docker только
# мониторинг. Prometheus ходит за метриками на хост (host.docker.internal:8000).
#     docker compose up -d                  # поднимет prometheus и grafana
#
# РЕЖИМ 2 (всё в Docker, профиль full): коллектор и API тоже в контейнерах. Перед этим
# ОБЯЗАТЕЛЬНО остановите systemd-сервисы weather-collector и weather-api (конфликт порта 8000,
# BLE-адаптера и базы данных) и отключите их автозапуск (systemctl disable).
#     docker compose --profile full up -d --build
#
# Дашборд: http://<хост>:8000/   Grafana: http://<хост>:3000   Prometheus: http://<хост>:9090
#
# Настройки и секреты — в файле .env рядом с этим файлом (в образ он не копируется,
# см. .dockerignore). Обязательно задайте GF_ADMIN_PASSWORD (пароль администратора Grafana).

services:
  # --- Weather collector (BLE + погода + запись в БД) ---
  weather-collector:
    build: .
    profiles: ["full"]
    command: python collector/main.py
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./sensors.yaml:/app/sensors.yaml:ro
      # bleak общается с BlueZ хоста через D-Bus; без сокета BLE в контейнере не работает
      - /var/run/dbus:/var/run/dbus
    # BLE-адаптер хоста (Linux)
    network_mode: host

  # --- Weather API + dashboard ---
  weather-api:
    build: .
    profiles: ["full"]
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./sensors.yaml:/app/sensors.yaml:ro
    depends_on:
      - weather-collector
    healthcheck:
      # /health отвечает 503, если данные датчиков устарели — контейнер станет unhealthy
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    # доступ к API на хосте (systemd) или к опубликованному порту контейнера weather-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  # --- Grafana ---
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?задайте GF_ADMIN_PASSWORD в .env}
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
