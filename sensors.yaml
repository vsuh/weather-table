# Список датчиков weather-table.
#
# Каждый датчик:
#   id       — уникальный идентификатор (используется в БД и API)
#   name     — человекочитаемое имя
#   location — место установки (комната, подвал, улица)
#   source   — тип источника:
#                ble     — BLE-датчик (нужен mac и protocol)
#                weather — внешний погодный провайдер (Open-Meteo)
#   mac      — MAC-адрес (только для source: ble)
#   protocol — формат данных: atc | bthome (только для source: ble)

sensors:
  - id: living_room
    name: Комната
    location: living_room
    source: ble
    mac: "A4:C1:38:20:64:92"
    protocol: atc

  - id: storage
    name: Кладовка
    location: storage
    source: ble
    mac: "A4:C1:38:3D:B6:AF"
    protocol: atc

  # Уличная погода от Open-Meteo (координаты в .env).
  # Отключено — API недоступен из сети.
  # - id: outdoor
  #   name: Улица (Open-Meteo)
  #   location: outdoor
  #   source: weather
