# Список датчиков weather-table.
#
# Каждый датчик:
#   id       — уникальный идентификатор (используется в БД и API)
#   name     — человекочитаемое имя
#   location — место установки (комната, подвал, улица)
#   source   — тип источника:
#                ble     — BLE-датчик (нужен mac; protocol — по умолчанию atc)
#                weather — внешний погодный провайдер (см. WEATHER_PROVIDER в .env)
#   mac      — MAC-адрес (только для source: ble)
#   protocol — формат рассылки (только для source: ble); поддерживается atc —
#              прошивка ATC_MiThermometer pvvx, формат custom (UUID 0x181A)

sensors:
  - id: living_room
    name: Комната
    location: living_room
    source: ble
    mac: "A4:C1:38:20:64:92"
    protocol: atc

  - id: storage
    name: Кладовка
    location: storage
    source: ble
    mac: "A4:C1:38:3D:B6:AF"
    protocol: atc

  # Уличная погода (наблюдения за прошедшие часы) от провайдера из WEATHER_PROVIDER;
  # координаты в .env.
  - id: outdoor
    name: Улица
    location: outdoor
    source: weather
